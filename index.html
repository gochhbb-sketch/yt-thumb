<!DOCTYPE html>
<html>
<head>
    <title>Thumbnail Studio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; background: #0a0a0a; color: white; text-align: center; padding: 20px; }
      .box { max-width: 500px; margin: 50px auto; background: #1a1a1a; padding: 30px; border-radius: 15px; margin-bottom: 20px; }
        input { width: 90%; padding: 15px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
        button { background: #ff0000; color: white; padding: 15px 40px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin: 5px; }
        img { max-width: 100%; margin-top: 20px; border-radius: 10px; border: 2px solid #ff0000; }
        h1 { color: #ff0000; }
        h2 { color: #ffffff; margin-bottom: 20px; font-size: 20px; }
      .download { background: #00ff00; color: black; font-weight: bold; }
    </style>
</head>
<body>
    <h1>📸 THUMBNAIL STUDIO</h1>

    <div class="box">
        <h2>YouTube Thumbnail Downloader</h2>
        <input type="text" id="url" placeholder="YouTube video link paste karo...">
        <br><br>
        <button onclick="getThumb()">Get Thumbnail</button>
        <div id="thumbResult"></div>
    </div>

    <script>
        function getThumb() {
            const url = document.getElementById('url').value;
            const result = document.getElementById('thumbResult');
            if(!url) { alert('Link daalo pehle'); return; }

            let videoId = '';
            if(url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            } else if(url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1].split('&')[0];
            } else if(url.includes('shorts/')) {
                videoId = url.split('shorts/')[1].split('?')[0];
            } else {
                alert('Sahi YouTube link daalo');
                return;
            }

            const thumbUrl = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
            result.innerHTML = `
                <img src="${thumbUrl}" alt="Thumbnail">
                <br><br>
                <a href="${thumbUrl}" download="thumbnail-${videoId}.jpg" target="_blank">
                    <button class="download">Download HD</button>
                </a>
            `;
        }
    </script>
</body>
</html>
